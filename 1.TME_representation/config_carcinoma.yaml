# EcoNet Network Construction, pan-cancer (Carcinoma model, CE1-CE10).
# Run one config per cancer, then combine with merge_pancancer.py.
#   python run_pipeline.py --config config_carcinoma.yaml

scrna_h5ad: "PATH/TO/your_cancer_scRNA.h5ad"           # <-- EDIT: log-normalized AnnData
nichenet_dir: "PATH/TO/NicheNet_DB"                    # <-- EDIT: NicheNet CSVs (see README)
ecotyper_dir: "PATH/TO/EcotyperModels/Carcinoma"       # <-- EDIT
ecotype_abundance: "PATH/TO/ecotype_abundance.txt"     # <-- EDIT

output_dir: "output_LUAD"                              # <-- one dir per cancer, e.g. output_{CANCER}

# .obs columns in the h5ad
cell_state_column: "CellType_State"
sample_column: "Sample"

# Pipeline parameters
overexpr_thresh_p: 100
lri_variable_both: false
n_boot: 100
hill_kh: 0.5
hill_n: 1
comm_thresh_prob: 0
comm_thresh_pval: 0.05
top_ligands_k: 5
expression_threshold: 1
top_mediators_n: 2
n_jobs: -1
