# EcoNet Network Construction, ccRCC (CCRCC EcoTyper model, RE1-RE11).
# Edit the input paths, then:
#   python run_pipeline.py --config config_ccRCC.yaml

scrna_h5ad: "PATH/TO/your_scRNA.h5ad"          # <-- EDIT: log-normalized AnnData
nichenet_dir: "PATH/TO/NicheNet_DB"            # <-- EDIT: NicheNet CSVs (see README)
ecotyper_dir: "PATH/TO/EcotyperModel"          # <-- EDIT: EcoTyper output (Cell_States/ + Ecotypes/)
ecotype_abundance: "PATH/TO/ecotype_abundance.txt"   # <-- EDIT: ecotypes x samples

output_dir: "output_ccRCC"

# .obs columns in the h5ad
cell_state_column: "CellType_State"
sample_column: "Sample"

# Pipeline parameters
overexpr_thresh_p: 100
lri_variable_both: false
n_boot: 100
hill_kh: 0.5
hill_n: 1
comm_thresh_prob: 0
comm_thresh_pval: 0.05
top_ligands_k: 5
expression_threshold: 1
top_mediators_n: 2
n_jobs: -1
