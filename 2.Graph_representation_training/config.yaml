# EcoNet GAT Pretraining. Edit the input paths, then:
#   python run_pipeline.py --config config.yaml

graph_pkl: "../1.TME_representation/output_ccRCC/global_graph.pkl"   # <-- EDIT: network from Step 1
expression_tsv: "PATH/TO/bulk_expression_tpm.tsv"                     # <-- EDIT: raw TPM, genes x samples
abundance_tsv: "PATH/TO/ecotype_abundance.txt"                       # <-- EDIT: training target

output_dir: "output"

# num_ecotypes: 11 for ccRCC (RE1-RE11), 10 for Carcinoma (CE1-CE10)
num_ecotypes: 11
in_channels: 1
hidden_channels: 8
gat_heads_1: 4
gat_heads_2: 1
fc_dim: 128
dropout: 0.2

learning_rate: 0.0005
num_epochs: 1000
batch_size: 8
num_folds: 5
random_seed: 123
top_k_edges: 5
