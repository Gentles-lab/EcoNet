# EcoNet Transfer Learning, ccRCC. Edit paths, then:
#   python run_pipeline.py --config config_ccRCC.yaml

graph_pkl:     "../1.TME_representation/output_ccRCC/global_graph.pkl"   # <-- EDIT: from Step 1
gat_model_pth: "../2.Graph_representation_training/output/NN11GraphModel.pth"              # <-- EDIT: from Step 2
tcga_expression_tsv: "PATH/TO/tcga_reference_tpm.tsv"                    # <-- EDIT: KNN imputation reference

response_model_pth: null    # null = train from scratch on the data below

# Pre-training data (pan-cancer immunotherapy cohort)
pretrain_expression_tsv: "PATH/TO/pretrain_expression_tpm.tsv"           # <-- EDIT
pretrain_clinical_tsv:   "PATH/TO/pretrain_clinical.tsv"                 # <-- EDIT

# Fine-tuning (optional; null to skip). +clinical = tune predictor; +abundance = also tune GAT
finetune_expression_tsv: "PATH/TO/finetune_expression_tpm.tsv"           # <-- EDIT or null
finetune_clinical_tsv:   "PATH/TO/finetune_clinical.tsv"                # <-- EDIT or null
finetune_abundance_tsv:  "PATH/TO/finetune_ecotype_abundance.txt"       # <-- EDIT or null

output_dir: "output_ccRCC"

sample_id_column: "ID"
response_column: "Response"
response_mapping: {R: 1, NR: 0}

# Architecture: must match Step 2
num_ecotypes: 11
in_channels: 1
hidden_channels: 8
gat_heads_1: 4
gat_heads_2: 1
fc_dim: 128
gat_dropout: 0.2
response_hidden_dims: [32, 16]
response_dropout: 0.1
knn_neighbors: 16

# Pre-training hyperparameters
pretrain_epochs: 200
pretrain_lr: 0.005
pretrain_batch_size: 16
pretrain_weight_decay: 0.001

# Fine-tuning hyperparameters
finetune_epochs: 20
finetune_lr_ecotyper: 0.0001
finetune_lr_response: 0.00000001
finetune_batch_size: 4
finetune_weight_decay: 0.00000001

random_seed: 111
top_k_edges: 5
